selectors:
  # Multiple fallback selectors for robustness
  email: "input[type=\"email\"]"
  password: "input[type=\"password\"]"
  loginButton: "button[type=\"submit\"]"
  messageInput: "textarea"
  sendButton: "button:has-text(\"Send\")"
  # Response selectors with fallbacks to avoid CSS/HTML
  response: ".prose"
  response_fallbacks:
    - ".message-body"
    - "[data-testid=\"message-text\"]"
    - ".chat-message-assistant"

captcha:
  enabled: true
  selectors:
    - "iframe[src*='captcha']"
    - "#captcha"
    - ".captcha-wrapper"

settings:
  slowLoad: false
  requiresAuth: true
  timeout: 60000
  captcha_wait: 120000

