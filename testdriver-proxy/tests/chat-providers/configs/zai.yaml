# Status: Failed (Authentication issue)

name: zai
url: https://z.ai/

credentials:
  email: developer@pixelium.uk
  password: developer123

selectors:
  # Multiple fallback selectors for authentication
  email: "input[type=\"email\"]"
  email_fallbacks:
    - "input[name=\"email\"]"
    - "#email"
    - "input[placeholder*=\"email\" i]"
  password: "input[type=\"password\"]"
  loginButton: "button[type=\"submit\"]"
  messageInput: "textarea"
  sendButton: "button[aria-label=\"Send\"]"
  response: ".message-content"
  response_fallbacks:
    - ".chat-response"
    - "[data-message-type=\"assistant\"]"
    - ".ai-message"

captcha:
  enabled: true
  selectors:
    - "iframe[src*='captcha']"
    - "#captcha"
    - ".recaptcha-container"

settings:
  slowLoad: false
  requiresAuth: true  # Requires proper authentication
  timeout: 60000
  captcha_wait: 120000
  auth_required: true

# Expected Response
expected_model: "Z.ai (Zhipu AI GLM-4.5)"
expected_response_pattern: ".*z\\.ai.*"

